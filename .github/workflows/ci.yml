name: Foundation and PostgreSQL CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: rass_sprint1_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_ephemeral_database_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rass_sprint1_tests"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Credentials only for this ephemeral localhost CI service, never production.
      RASS_DB_TEST_ADMIN: Host=localhost;Port=5432;Database=rass_sprint1_tests;Username=postgres;Password=ci_ephemeral_database_only
      RASS_DB_TEST_RUNTIME: Host=localhost;Port=5432;Database=rass_sprint1_tests;Username=rass_app_runtime;Password=ci_ephemeral_runtime_only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet restore RassAppControleFin.slnx --locked-mode
      - run: dotnet build RassAppControleFin.slnx --no-restore -c Release
      - run: dotnet test RassAppControleFin.slnx --no-build --no-restore -c Release --filter "Category!=LiveAuth"
      - run: pwsh ./scripts/Check-Dependencies.ps1
      - run: pwsh ./scripts/Test-SecretHygiene.ps1
      - run: dotnet publish src/RassAppControleFin.Api -c Release --no-restore -o artifacts/publish/api
      - run: dotnet publish src/RassAppControleFin.Admin.Web -c Release --no-restore -o artifacts/publish/admin
      - run: dotnet publish tools/RassAppControleFin.Database -c Release --no-restore -o artifacts/publish/database
  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - run: dotnet workload install maui-android
      - run: dotnet restore RassAppControleFin.Mobile.slnx --locked-mode
      - shell: pwsh
        run: dotnet build RassAppControleFin.Mobile.slnx -c Release --no-restore -p:AndroidPackageFormats=apk "-p:AndroidSdkDirectory=$env:ANDROID_HOME"
